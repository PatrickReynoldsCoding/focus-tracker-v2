<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)" />
    <script>
      // The theme on this device (Settings → Appearance) and the open profile's own, applied before the first paint so there is no flash.
      // Keep in step with currentThemeId() in web/src/core/theme.ts, which also keeps the saved rule for each theme (ft.tcss.<id>).
      try {
        var g = function (k) { return localStorage.getItem(k); };
        var old = g('ft.theme');
        var raw = old === 'light' ? 'paper' : old === 'dark' ? 'midnight' : old === 'eink' ? null : old;
        var fl = g('ft.follow');
        var follow = fl === '1' ? true : fl === '0' ? false : !raw;
        var night = matchMedia('(prefers-color-scheme: dark)').matches;
        var id = g('ft.eink') === '1' || old === 'eink' ? 'eink'
          : g('ft.ptheme.' + (g('ft.mode') || 'personal'))
            || (follow ? g(night ? 'ft.theme.dark' : 'ft.theme.light') || (night ? 'midnight' : 'paper') : raw || 'paper');
        var css = id === 'eink' ? '' : g('ft.tcss.' + id);
        if (css || id === 'eink') {
          var st = document.createElement('style');
          st.id = 'ft-theme';
          st.textContent = css;
          document.head.appendChild(st);
          document.documentElement.setAttribute('data-theme', id);
          document.documentElement.setAttribute('data-kind', /color-scheme:dark/.test(css) ? 'dark' : 'light');
          var hit = /--bg:(#[0-9a-f]{6})/.exec(css);
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++) m[i].setAttribute('content', hit ? hit[1] : '#ffffff');
        }
      } catch (e) {}
    </script>
    <title>Focus Tracker</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
